<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Dinto Manpower Tracker</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Archivo:wght@400;500;600;700;800;900&family=Space+Mono:wght@400;700&display=swap" rel="stylesheet">
<style>
*,*::before,*::after{margin:0;padding:0;box-sizing:border-box}
:root{
  --red:#E2123C;--red-hover:#c11030;--red-glyph:#E2123C;--red-tint:rgba(226,20,60,.10);
  --sidebar:#16161a;
  --bg:#f4f4f5;--panel-1:#fff;--panel-2:#fafafa;
  --border:#e4e4e7;--border-hairline:#f1f1f2;--border-input:#d4d4d8;
  --text:#18181b;--text-sec:#3f3f46;--text-muted:#71717a;--text-label:#a1a1aa;--text-faint:#d4d4d8;
  --green:#16a34a;--amber:#b45309;
  --sans:'Archivo',-apple-system,system-ui,sans-serif;--mono:'Space Mono',monospace;
  --radius-card:10px;--radius-ctrl:9px;
  --rail-w:236px;--topbar-h:64px;
}
body{font-family:var(--sans);background:var(--bg);color:var(--text);min-height:100vh}
button{font-family:inherit;cursor:pointer}
input,select,textarea{font-family:inherit}
::-webkit-scrollbar{height:11px;width:11px}
::-webkit-scrollbar-thumb{background:#cdcdd2;border-radius:6px;border:2px solid #fff}
::-webkit-scrollbar-thumb:hover{background:#b4b4ba}
::-webkit-scrollbar-track{background:transparent}
#login-screen{position:fixed;inset:0;z-index:200;display:flex;align-items:center;justify-content:center;background:radial-gradient(900px 600px at 50% -10%,#14202c 0%,#0c1117 60%)}
.login-card{background:#fff;border-radius:18px;width:432px;padding:40px 38px 30px;box-shadow:0 30px 70px rgba(0,0,0,.45);display:flex;flex-direction:column;gap:20px}
.login-logo{text-align:center}
.login-sub{text-align:center;font-size:11px;font-weight:600;letter-spacing:3.5px;color:var(--red);margin-top:-12px}
.login-field label{display:block;font-size:12px;color:#555;margin-bottom:6px;font-weight:500}
.login-field input{width:100%;padding:12px 14px;border-radius:10px;border:1px solid #ddd9d0;background:#f4f3f0;font-size:14px;color:#222;outline:none;transition:border .15s}
.login-field input:focus{border-color:var(--red)}
.btn-signin{width:100%;padding:14px;border-radius:11px;border:none;background:var(--red);color:#fff;font-size:15px;font-weight:700;cursor:pointer;transition:background .15s}
.btn-signin:hover{background:var(--red-hover)}
.login-demo{font-size:11px;color:#999;text-align:center}
.login-demo a{color:var(--red);cursor:pointer;text-decoration:none}
#login-error{display:none;color:var(--red);font-size:12px;font-weight:600;text-align:center;padding:6px 10px;border-radius:8px;background:rgba(226,20,60,.08)}
@media(max-width:500px){.login-card{width:calc(100vw - 24px);padding:28px 18px 20px}}
#loading-overlay{position:fixed;inset:0;z-index:300;background:#0c1117;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:16px;transition:opacity .3s}
#loading-overlay.fade{opacity:0;pointer-events:none}
#app{display:none;width:100%;height:100vh}
#app.visible{display:flex}
.rail{width:var(--rail-w);background:var(--sidebar);border-right:1px solid rgba(255,255,255,.06);display:flex;flex-direction:column;flex-shrink:0;overflow:hidden}
.rail-logo{padding:22px 18px 14px;border-bottom:1px solid rgba(255,255,255,.08);display:flex;align-items:center;gap:10px}
.rail-logo-text{font-size:9px;font-weight:700;letter-spacing:1px;color:#71717a;text-transform:uppercase;line-height:1.4;font-family:var(--mono)}
.rail-nav{flex:1;padding:12px 10px;display:flex;flex-direction:column;gap:2px;overflow-y:auto}
.nav-item{display:flex;align-items:center;gap:12px;padding:12px 13px;cursor:pointer;font-size:14px;font-weight:500;color:#a1a1aa;border-left:3px solid transparent;border-radius:9px;transition:all .15s;background:none;border-top:none;border-right:none;border-bottom:none;width:100%;text-align:left;margin-bottom:2px}
.nav-item:hover{background:rgba(255,255,255,.05);color:#d4d4d8}
.nav-item.active{background:rgba(255,255,255,.07);color:#fff;font-weight:700;border-left-color:var(--red)}
.nav-item svg{width:18px;height:18px;flex-shrink:0}
.rail-user{padding:14px;border-top:1px solid rgba(255,255,255,.08);display:flex;align-items:center;gap:10px}
.user-avatar{width:36px;height:36px;border-radius:36px;background:var(--red);display:flex;align-items:center;justify-content:center;font-size:13px;font-weight:700;color:#fff;flex-shrink:0}
.user-info{flex:1;min-width:0}
.user-name{font-size:13px;font-weight:600;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;color:#fff}
.user-role{font-size:10px;color:#71717a;font-family:var(--mono)}
.btn-logout{background:none;border:none;color:#5f6e7d;cursor:pointer;padding:4px;border-radius:6px;transition:color .15s}
.btn-logout:hover{color:#a1a1aa}
.main-col{flex:1;min-width:0;display:flex;flex-direction:column;overflow:hidden}
.topbar{height:var(--topbar-h);background:#fff;border-bottom:1px solid var(--border);display:flex;align-items:center;padding:0 26px;gap:14px;flex-shrink:0}
.screen-title{font-size:19px;font-weight:800;letter-spacing:-.3px;white-space:nowrap;margin:0}
.topbar-spacer{flex:1}
.live-dot{width:8px;height:8px;border-radius:50%;background:var(--green);animation:pulse 2s infinite;flex-shrink:0}
@keyframes pulse{0%,100%{opacity:1}50%{opacity:.4}}
.screen{flex:1;overflow-y:auto;padding:26px 26px 90px}
.panel{background:#fff;border:1px solid var(--border);border-radius:12px;overflow:hidden}
.kpi-card{background:#fff;border:1px solid var(--border);border-radius:var(--radius-card);padding:15px 16px}
.kpi-label{font-size:11px;font-weight:700;text-transform:uppercase;letter-spacing:1.2px;color:var(--text-label);margin-bottom:8px}
.kpi-val{font-family:var(--mono);font-size:28px;font-weight:800;line-height:1;letter-spacing:-1px}
.kpi-sub{font-size:12px;color:var(--text-muted);margin-top:6px}
.btn-red{padding:9px 16px;border-radius:9px;border:none;background:var(--red);color:#fff;font-size:13px;font-weight:700;cursor:pointer;display:inline-flex;align-items:center;gap:6px;transition:background .15s;white-space:nowrap}
.btn-red:hover{background:var(--red-hover)}
.btn-outline{padding:9px 16px;border-radius:9px;border:1px solid var(--border);background:#fff;color:#52525b;font-size:13px;font-weight:600;cursor:pointer;display:inline-flex;align-items:center;gap:6px;transition:all .15s;white-space:nowrap}
.btn-outline:hover{border-color:#a1a1aa;color:#18181b}
.btn-ghost{padding:5px 9px;border-radius:7px;border:none;background:transparent;color:var(--text-muted);font-size:12px;cursor:pointer;transition:all .15s}
.btn-ghost:hover{background:rgba(0,0,0,.05);color:var(--text)}
.form-field{display:flex;flex-direction:column;gap:6px}
.form-label{font-size:12px;font-weight:500;color:#555}
.form-input,.form-select,.form-textarea{padding:12px 14px;border-radius:10px;border:1px solid #ddd9d0;background:#f4f3f0;font-size:14px;color:#222;outline:none;transition:border .15s;width:100%}
.form-input:focus,.form-select:focus,.form-textarea:focus{border-color:var(--red);background:#fff}
.form-textarea{resize:vertical;min-height:80px}
.form-row{display:grid;grid-template-columns:1fr 1fr;gap:12px}
.form-select option{background:#fff;color:#18181b}
.modal-backdrop{position:fixed;inset:0;background:rgba(0,0,0,.45);display:flex;align-items:center;justify-content:center;z-index:100;backdrop-filter:blur(2px);padding:16px}
.modal{background:#fff;border-radius:18px;width:100%;max-width:520px;max-height:90vh;overflow-y:auto;box-shadow:0 30px 70px rgba(0,0,0,.3)}
.modal-lg{max-width:640px}
.modal-header{display:flex;align-items:center;justify-content:space-between;padding:20px 24px;border-bottom:1px solid #e4e4e7;position:sticky;top:0;background:#fff;z-index:1}
.modal-title{font-size:16px;font-weight:700}
.modal-close{width:30px;height:30px;border-radius:8px;border:none;background:#f4f4f5;color:#71717a;cursor:pointer;font-size:16px;display:flex;align-items:center;justify-content:center;flex-shrink:0}
.modal-close:hover{color:#18181b}
.modal-body{padding:24px;display:flex;flex-direction:column;gap:16px}
.modal-foot{padding:16px 24px;border-top:1px solid #e4e4e7;display:flex;gap:10px;justify-content:flex-end;position:sticky;bottom:0;background:#fff}
.modal-error{color:var(--red);font-size:12px;font-weight:600;display:none}
.badge{display:inline-block;font-family:var(--mono);font-weight:700;text-transform:uppercase;border-radius:5px;font-size:9px;letter-spacing:.8px;padding:4px 8px;white-space:nowrap}
.badge-in{background:rgba(226,20,60,.10);color:var(--red)}
.badge-out{background:#EEF2FF;color:#4338CA}
.badge-pending{background:#FEF3C7;color:#92400E}
.badge-approved{background:#DCFCE7;color:#166534}
.badge-denied{background:#F3F4F6;color:#6B7280}
.badge-urgent{background:#FEE2E2;color:#B91C1C}
.badge-high{background:#FFEDD5;color:#C2410C}
.badge-normal{background:#E0E7FF;color:#3730A3}
.badge-low{background:#F1F5F9;color:#475569}
.badge-admin{background:#FEF3C7;color:#92400E}
.badge-pm{background:#DCFCE7;color:#166534}
.badge-foreman{background:rgba(226,20,60,.10);color:var(--red)}
.data-table{width:100%;border-collapse:collapse}
.data-table th{font-size:10px;font-weight:700;text-transform:uppercase;letter-spacing:.8px;color:var(--text-label);padding:10px 16px;text-align:left;border-bottom:1px solid var(--border);background:#fafafa}
.data-table td{padding:12px 16px;border-bottom:1px solid var(--border-hairline);font-size:13px;vertical-align:middle;color:var(--text)}
.data-table tr:last-child td{border-bottom:none}
.data-table tr:hover td{background:#fafafa}
.req-card{background:#fff;border:1px solid #e4e4e7;border-radius:11px;padding:15px 16px;cursor:pointer;width:100%;text-align:left;transition:all .12s}
.req-card:hover{border-color:#a1a1aa}
.req-card.selected{border:1.5px solid var(--red);box-shadow:rgba(226,20,60,.13) 0 0 0 3px}
.worker-chip{display:flex;align-items:center;gap:8px;padding:8px 10px;border-radius:10px;border:1.5px solid #e4e4e7;background:#fff;cursor:pointer;transition:all .15s}
.worker-chip:hover,.worker-chip.selected{border-color:var(--red);background:rgba(226,20,60,.04)}
.chip-avatar{width:32px;height:32px;border-radius:8px;display:flex;align-items:center;justify-content:center;font-size:12px;font-weight:700;flex-shrink:0}
.gantt-wrap{overflow:auto;max-height:566px;border:1px solid #e4e4e7;border-radius:10px;background:#fff}
.gantt-inner{display:flex;min-width:max-content}
.gantt-labels{width:222px;flex:0 0 222px;position:sticky;left:0;z-index:3;background:#fff;border-right:1px solid #e4e4e7}
.gantt-corner{height:46px;display:flex;align-items:flex-end;padding:0 12px 10px;border-bottom:1px solid #e4e4e7;position:sticky;top:0;z-index:4;background:#fff}
.gantt-group-row{height:30px;background:#fafafa;border-bottom:1px solid #ececee;border-top:1px solid #ececee;display:flex;align-items:center;justify-content:space-between;padding:0 12px}
.gantt-person-row{height:46px;border-bottom:1px solid #f1f1f2;display:flex;align-items:center;gap:10px;padding:0 12px}
.gantt-timeline-header{height:46px;position:sticky;top:0;z-index:2;background:#fff;border-bottom:1px solid #e4e4e7}
.detail-pane{background:#fff;border:1px solid #e4e4e7;border-radius:12px;padding:22px}
.detail-label{font-size:10px;font-weight:700;text-transform:uppercase;letter-spacing:.8px;color:#a1a1aa;margin-bottom:4px;font-family:var(--mono)}
.detail-val{font-size:14px;font-weight:600;color:#18181b}
.detail-sub{font-size:12px;color:#71717a;margin-top:2px}
.empty-state{display:flex;flex-direction:column;align-items:center;gap:12px;padding:48px 24px;text-align:center;border:1.5px dashed #d4d4d8;border-radius:14px}
.empty-state svg{color:#d4d4d8}
.empty-state h3{font-size:15px;font-weight:600;color:#52525b}
.empty-state p{font-size:13px;color:#71717a;max-width:280px}
.color-dot{width:10px;height:10px;border-radius:50%;flex-shrink:0;display:inline-block}
.hidden{display:none!important}
#toast{position:fixed;bottom:24px;left:50%;transform:translateX(-50%) translateY(100px);background:#18181b;border:1px solid var(--green);border-radius:12px;padding:12px 20px;display:flex;align-items:center;gap:10px;font-size:13px;font-weight:600;color:var(--green);box-shadow:0 16px 40px rgba(0,0,0,.25);z-index:400;transition:transform .25s ease,opacity .25s ease;opacity:0;pointer-events:none}
#toast.show{transform:translateX(-50%) translateY(0);opacity:1}
#toast.error{border-color:var(--red);color:#ff5d77}
.mobile-nav{display:none;position:fixed;bottom:0;left:0;right:0;z-index:50;background:var(--sidebar);border-top:1px solid rgba(255,255,255,.08);padding:6px 0 max(6px,env(safe-area-inset-bottom));flex-direction:row;justify-content:space-around}
.mobile-nav-item{display:flex;flex-direction:column;align-items:center;gap:3px;flex:1;padding:6px 4px;cursor:pointer;border:none;background:none;color:#71717a;font-size:10px;font-weight:700;letter-spacing:.3px;font-family:var(--mono);transition:color .15s}
.mobile-nav-item.active{color:#fff}
.mobile-nav-item svg{width:22px;height:22px}
@media(max-width:768px){.rail{display:none}.mobile-nav{display:flex}.screen{padding:14px 14px calc(72px + env(safe-area-inset-bottom))}.form-row{grid-template-columns:1fr}.modal{max-width:100%;border-radius:14px}}
</style>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2/dist/umd/supabase.min.js"></script>
</head>
<body>

<!-- LOADING -->
<div id="loading-overlay">
  <svg width="48" height="48" viewBox="0 0 28 28" fill="none"><path d="M0 0H16a14 14 0 0 1 0 28H0V0zM6 6H16a8 8 0 0 1 0 16H6V6z" fill="#E2143C"/></svg>
  <div style="font-size:13px;color:#5f6e7d">Loading…</div>
</div>

<!-- LOGIN -->
<div id="login-screen" style="display:none">
  <div class="login-card">
    <div class="login-logo">
      <svg width="228" height="48" viewBox="0 0 228 48" fill="none">
        <path d="M0 4H28a20 20 0 0 1 0 40H0V4zM10 13H28a11 11 0 0 1 0 22H10V13z" fill="#E2143C"/>
        <text x="50" y="32" font-family="IBM Plex Sans,sans-serif" font-weight="700" font-size="20" fill="#111">DINTO ELECTRICAL</text>
        <text x="50" y="46" font-family="IBM Plex Sans,sans-serif" font-weight="400" font-size="11" fill="#666">CONTRACTORS, INC.</text>
      </svg>
    </div>
    <div class="login-sub">MANPOWER TRACKER</div>
    <div class="login-field">
      <label>Email</label>
      <input type="email" id="login-email" placeholder="you@dinto.com" autocomplete="off">
    </div>
    <div class="login-field">
      <label>Password</label>
      <input type="password" id="login-password" placeholder="&#x2022;&#x2022;&#x2022;&#x2022;&#x2022;&#x2022;&#x2022;&#x2022;" onkeydown="if(event.key==='Enter')doLogin()">
    </div>
    <div id="login-error"></div>
    <button class="btn-signin" onclick="doLogin()">Sign in</button>
    <div class="login-demo">
      <a onclick="showRegister()">Create account</a> &nbsp;&middot;&nbsp;
      <a onclick="demoLogin('admin')" style="color:#9aa7b5">Admin demo</a> &nbsp;&middot;&nbsp;
      <a onclick="demoLogin('pm')" style="color:#9aa7b5">PM demo</a>
    </div>
  </div>
</div>

<!-- REGISTER -->
<div id="register-screen" style="display:none;position:fixed;inset:0;z-index:200;align-items:center;justify-content:center;background:radial-gradient(900px 600px at 50% -10%,#14202c 0%,#0c1117 60%)">
  <div class="login-card">
    <div class="login-logo">
      <svg width="228" height="48" viewBox="0 0 228 48" fill="none">
        <path d="M0 4H28a20 20 0 0 1 0 40H0V4zM10 13H28a11 11 0 0 1 0 22H10V13z" fill="#E2143C"/>
        <text x="50" y="32" font-family="IBM Plex Sans,sans-serif" font-weight="700" font-size="20" fill="#111">DINTO ELECTRICAL</text>
        <text x="50" y="46" font-family="IBM Plex Sans,sans-serif" font-weight="400" font-size="11" fill="#666">CONTRACTORS, INC.</text>
      </svg>
    </div>
    <div class="login-sub">CREATE ACCOUNT</div>
    <div class="form-row" style="gap:10px">
      <div class="login-field"><label>First Name</label><input type="text" id="reg-first" placeholder="First"></div>
      <div class="login-field"><label>Last Name</label><input type="text" id="reg-last" placeholder="Last"></div>
    </div>
    <div class="login-field"><label>Email</label><input type="email" id="reg-email" placeholder="you@dinto.com"></div>
    <div class="login-field"><label>Password</label><input type="password" id="reg-password" placeholder="At least 6 characters"></div>
    <div class="login-field"><label>Confirm Password</label><input type="password" id="reg-password2" placeholder="Repeat password" onkeydown="if(event.key==='Enter')doRegister()"></div>
    <div id="reg-error" style="display:none;color:var(--red);font-size:12px;font-weight:600;text-align:center"></div>
    <button class="btn-signin" onclick="doRegister()">Create Account</button>
    <div class="login-demo">Already have an account? <a onclick="showSignIn()">Sign in</a></div>
  </div>
</div>

<!-- APP -->
<div id="app">
  <nav class="rail">
    <div class="rail-logo">
      <svg width="28" height="28" viewBox="0 0 28 28" fill="none"><path d="M0 0H16a14 14 0 0 1 0 28H0V0zM6 6H16a8 8 0 0 1 0 16H6V6z" fill="#E2143C"/></svg>
      <div class="rail-logo-text">Manpower<br>Tracker</div>
    </div>
    <div class="rail-nav" id="rail-nav"></div>
    <div class="rail-user">
      <div class="user-avatar" id="rail-avatar">SL</div>
      <div class="user-info">
        <div class="user-name" id="rail-name">Sara Lin</div>
        <div class="user-role" id="rail-role">Project Manager</div>
      </div>
      <button class="btn-logout" onclick="doLogout()" title="Sign out">
        <svg width="16" height="16" fill="none" stroke="currentColor" stroke-width="1.8" viewBox="0 0 24 24"><path d="M9 21H5a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h4"/><polyline points="16 17 21 12 16 7"/><line x1="21" y1="12" x2="9" y2="12"/></svg>
      </button>
    </div>
  </nav>

  <div class="main-col">
    <div class="topbar">
      <div style="display:flex;align-items:baseline;gap:14px;min-width:0">
        <h1 class="screen-title" id="topbar-title"></h1>
        <span id="topbar-sub" style="font-family:var(--mono);font-size:11px;color:#a1a1aa;letter-spacing:.5px;white-space:nowrap"></span>
      </div>
      <div class="topbar-spacer"></div>
      <div style="display:flex;align-items:center;gap:18px">
        <div style="display:flex;align-items:center;gap:7px;font-family:var(--mono);font-size:11px;color:#16a34a;font-weight:700">
          <div class="live-dot"></div>LIVE
        </div>
        <div style="display:flex;align-items:center;gap:10px">
          <div style="text-align:right">
            <div id="topbar-user-name" style="font-size:13px;font-weight:600"></div>
            <div id="topbar-user-role" style="font-family:var(--mono);font-size:10px;color:#a1a1aa"></div>
          </div>
          <div id="topbar-avatar" style="width:38px;height:38px;border-radius:38px;background:#18181b;color:#fff;display:flex;align-items:center;justify-content:center;font-weight:700;font-size:14px"></div>
        </div>
      </div>
    </div>
    <div class="screen" id="screen-area"></div>
  </div>

  <nav class="mobile-nav" id="mobile-nav"></nav>
</div>

<!-- TOAST -->
<div id="toast"><span id="toast-msg"></span></div>

<!-- ════════════════════════════════════════════════ MODALS ════ -->

<!-- New/Edit Request Modal -->
<div class="modal-backdrop hidden" id="modal-request">
  <div class="modal modal-lg">
    <div class="modal-header">
      <div class="modal-title" id="modal-request-title">New Manpower Request</div>
      <button class="modal-close" onclick="closeModal('modal-request')">&#x2715;</button>
    </div>
    <div class="modal-body">
      <div class="form-row">
        <div class="form-field">
          <label class="form-label">Direction</label>
          <select class="form-select" id="req-dir" onchange="updateRequestForm()">
            <option value="in">Incoming — I need crew</option>
            <option value="out">Outgoing — I'm releasing crew</option>
          </select>
        </div>
        <div class="form-field">
          <label class="form-label">Request Type</label>
          <select class="form-select" id="req-type" onchange="updateRequestForm()">
            <option value="person">Specific Person</option>
            <option value="role">By Role / Count</option>
          </select>
        </div>
      </div>
      <div id="req-person-fields">
        <div class="form-field">
          <label class="form-label">Worker</label>
          <select class="form-select" id="req-worker"></select>
        </div>
      </div>
      <div id="req-role-fields" class="hidden">
        <div class="form-row">
          <div class="form-field">

async function sbGet(table){
  if(!SB)return[];
  const{data,error}=await SB.from(table).select('*');
  if(error){
    console.error('sbGet',table,error.message,error.code);
    // Surface schema-missing errors clearly
    if(error.code==='42P01'||error.message.includes('does not exist')){
      showSchemaError(table);
    }
    return[];
  }
  return data||[];
}
async function sbUpsert(table,row){
  if(!SB){console.error('sbUpsert called but SB is null — Supabase not initialized');showToast('Database not connected',true);return false;}
  console.log('sbUpsert →',table,row);
  const{error}=await SB.from(table).upsert(row);
  if(error){
    console.error('sbUpsert FAILED',table,error.code,error.message,JSON.stringify(row));
    const msg=error.message||'Unknown error';
    showToast(msg.length>80?msg.slice(0,80)+'…':msg,true);
    return false;
  }
  console.log('sbUpsert OK',table,row.id);
  return true;
}
async function sbDelete(table,id){
  if(!SB)return false;
  const{error}=await SB.from(table).delete().eq('id',id);
  if(error){console.error('sbDelete',table,error.message);return false;}
  return true;
}

async function doLogin(){
  $('login-error').style.display='none';
  const email=$('login-email').value.trim().toLowerCase();
  const pw=$('login-password').value;
  if(!email||!pw){showLoginError('Please enter your email and password.');return;}
  const user=DATA.accounts.find(u=>u.email===email&&u.passwordHash===hashPw(pw));
  if(!user){showLoginError('Email or password is incorrect.');return;}
  loginAs(user);
}

async function doRegister(){
  const first=$('reg-first').value.trim(),last=$('reg-last').value.trim();
  const email=$('reg-email').value.trim().toLowerCase();
  const pw=$('reg-password').value,pw2=$('reg-password2').value;
  const err=id=>($('reg-error').textContent=id,$('reg-error').style.display='block');
  if(!first||!last){err('Please enter your full name.');return;}
  if(!email){err('Please enter your email.');return;}
  if(pw.length<6){err('Password must be at least 6 characters.');return;}
  if(pw!==pw2){err('Passwords do not match.');return;}
  if(DATA.accounts.find(u=>u.email===email)){err('An account with that email already exists.');return;}
  const newUser={id:'u'+uid(),first_name:first,last_name:last,email,passwordHash:hashPw(pw),role:'pm',jobId:'',name:(first+' '+last).trim()};
  DATA.accounts.push(newUser);
  await sbUpsert('accounts',{id:newUser.id,first_name:first,last_name:last,email,password_hash:hashPw(pw),role:'pm',project_id:null});
  saveLocalAccounts(DATA.accounts.map(a=>({id:a.id,firstName:a.first_name||a.name?.split(' ')[0],lastName:a.last_name||a.name?.split(' ')[1]||'',email:a.email,passwordHash:a.passwordHash,role:a.role})));
  loginAs(newUser);
}

    role:user.role||'pm',
    jobId:user.jobId||user.project_id||''
  };
  ME.loggedIn=true;
  localStorage.setItem(SESSION_KEY,JSON.stringify(ME));
  $('login-screen').style.display='none';
  $('register-screen').style.display='none';
  launchApp();
}

function doLogout(){
  localStorage.removeItem(SESSION_KEY);
  ME={id:'',name:'',initials:'',role:'',jobId:'',loggedIn:false};
  $('app').style.display='none';
  $('login-screen').style.display='flex';
  $('login-email').value='';$('login-password').value='';
  $('login-error').style.display='none';
}

// ═══════════════════════════════════════════════════════════════
function launchApp(){
  $('app').style.display='flex';

  $('rail-name').textContent=ME.name;
  $('rail-role').textContent={admin:'ADMIN',pm:'PROJECT MGR',foreman:'FOREMAN'}[ME.role]||ME.role.toUpperCase();

  const ta=$('topbar-avatar');if(ta)ta.textContent=ME.initials;
  const tr=$('topbar-user-role');if(tr)tr.textContent={admin:'ADMINISTRATOR',pm:'PROJECT MGR',foreman:'FOREMAN'}[ME.role]||ME.role.toUpperCase();
  buildNav();

}

];

function buildNav(){
  const items=NAV_ITEMS.filter(n=>n.roles.includes(ME.role));
  const rail=$('rail-nav');
  rail.innerHTML=items.map(n=>`
    <button class="nav-item${UI.screen===n.id?' active':''}" onclick="setScreen('${n.id}')">
      <svg fill="none" stroke="currentColor" stroke-width="1.7" viewBox="0 0 24 24">${n.icon}</svg>
      ${n.label}
    </button>`).join('');
  const mob=$('mobile-nav');
  mob.innerHTML=items.slice(0,5).map(n=>`
    <button class="mobile-nav-item${UI.screen===n.id?' active':''}" onclick="setScreen('${n.id}')">
      <svg fill="none" stroke="currentColor" stroke-width="1.7" viewBox="0 0 24 24">${n.icon}</svg>
      ${n.label}

function setScreen(s){
  UI.screen=s;
  const titles={dashboard:['Dashboard','MANPOWER OVERVIEW'],schedule:['Crew Schedule','WHERE EVERY HAND IS'],requests:['Manpower Requests','PM-TO-PM CREW TRANSFERS'],roster:['Company Roster','ALL FIELD PERSONNEL'],jobs:['Jobs','ACTIVE JOB SITES'],accounts:['Accounts','USER MANAGEMENT']};
  const[title,sub]=titles[s]||[s,''];$('topbar-title').textContent=title;const subEl=$('topbar-sub');if(subEl)subEl.textContent=sub;
  buildNav();
  render();
}

function render(){
  const screens={dashboard:renderDashboard,schedule:renderSchedule,requests:renderRequests,roster:renderRoster,jobs:renderJobs,accounts:renderAccounts};
  const fn=screens[UI.screen];
  if(fn)fn();
}

// SCREEN: SCHEDULE (Gantt)
// ═══════════════════════════════════════════════════════════════
const RANGE_START=new Date('2026-02-02T00:00:00');
const RANGE_END=new Date('2026-07-31T00:00:00');
const DAY_MS=86400000;
const PX={Day:18,Week:6.2,Month:2.4};
const MONTHS_SHORT=['Jan','Feb','Mar','Apr','May','Jun','Jul','Aug','Sep','Oct','Nov','Dec'];
const ROLE_ORDER=['General Foreman','Foreman','Subforeman','Journeyman','Apprentice','Master Electrician'];

function renderSchedule(){
  const zoom=UI.zoom;
  const ppd=PX[zoom];
  const width=Math.ceil((RANGE_END-RANGE_START)/DAY_MS*ppd);
  const todayX=Math.round((TODAY_DT-RANGE_START)/DAY_MS*ppd);

  const months=[];
  let mc=new Date(RANGE_START);mc.setDate(1);
  while(mc<=RANGE_END){months.push({label:MONTHS_SHORT[mc.getMonth()].toUpperCase()+" '"+String(mc.getFullYear()).slice(2),x:Math.round((mc-RANGE_START)/DAY_MS*ppd)});mc.setMonth(mc.getMonth()+1);}

  const weeks=[];
  if(zoom!=='Month'){let w=new Date(RANGE_START);while(w<=RANGE_END){const wx=Math.round((w-RANGE_START)/DAY_MS*ppd);if(wx>0)weeks.push(wx);w=new Date(w.getTime()+7*DAY_MS);}}

  const groups=ROLE_ORDER.map(role=>({role,people:DATA.workers.filter(w=>w.trade_class===role)})).filter(g=>g.people.length);

  let labelsHTML='<div class="gantt-corner"><span style="font-family:var(--mono);font-size:10px;color:var(--text-label)">CREW / ROLE</span></div>';
  let timelineHTML=`<div class="gantt-timeline-header" style="width:${width}px;position:relative">
    ${months.map(m=>`<div style="position:absolute;left:${m.x+5}px;top:0;height:100%;display:flex;align-items:center"><span style="font-family:var(--mono);font-size:11px;font-weight:700;color:var(--text-sec);white-space:nowrap">${m.label}</span></div>`).join('')}
    <div style="position:absolute;left:${todayX}px;top:0;bottom:0;display:flex;align-items:center;transform:translateX(-50%);z-index:3">
      <div style="background:var(--red);color:#fff;font-family:var(--mono);font-size:9px;font-weight:700;padding:3px 6px;border-radius:4px;white-space:nowrap">TODAY &middot; JUN 26</div>
    </div>
  </div>`;

  let gridHTML=`<div style="position:absolute;top:44px;left:0;right:0;bottom:0;pointer-events:none">
    ${months.map((m,i)=>i>0?`<div style="position:absolute;top:0;bottom:0;left:${m.x}px;width:1px;background:var(--border)"></div>`:'').join('')}
    ${weeks.map(wx=>`<div style="position:absolute;top:0;bottom:0;left:${wx}px;width:1px;background:rgba(255,255,255,.04)"></div>`).join('')}
    <div style="position:absolute;top:0;bottom:0;left:${todayX}px;width:2px;background:var(--red);opacity:.7"></div>
  </div>`;

  groups.forEach(g=>{
    labelsHTML+=`<div class="gantt-group-row"><span style="font-size:10px;font-weight:700;text-transform:uppercase;color:var(--text-sec);letter-spacing:.5px">${g.role}</span><span style="font-family:var(--mono);font-size:10px;color:var(--text-label)">${g.people.length}</span></div>`;
    timelineHTML+=`<div style="height:28px;background:rgba(255,255,255,.02);border-bottom:1px solid var(--border);border-top:1px solid var(--border);position:relative">${gridHTML}</div>`;

    g.people.forEach(p=>{
      const cj=currentJob(p);const j=jobById(cj);
      labelsHTML+=`<div class="gantt-person-row">
        <span class="color-dot" style="background:${j.color}"></span>
        <div style="min-width:0">
          <div style="font-size:13px;font-weight:600;white-space:nowrap;overflow:hidden;text-overflow:ellipsis">${p.name}</div>
          <div style="font-family:var(--mono);font-size:10px;color:var(--text-label)">${cj==='YARD'?'AVAILABLE':j.number||cj}</div>
        </div>
      </div>`;

      const workerAssigns=DATA.assignments.filter(a=>a.worker_id===p.id).sort((a,b)=>a.start_date<b.start_date?-1:1);
      let bars='';
      workerAssigns.forEach((a,idx)=>{
        const jj=jobById(a.job_id);
        const sd=new Date(a.start_date+'T00:00:00');
        const ed=a.is_permanent?RANGE_END:new Date((a.end_date||'2026-07-31')+'T00:00:00');
        const x0=Math.max(0,Math.round((sd-RANGE_START)/DAY_MS*ppd));
        const x1=Math.min(width,Math.round((ed-RANGE_START)/DAY_MS*ppd));
        const hEnd=Math.min(x1,todayX);
        if(x0<hEnd){const bw=hEnd-x0;bars+=`<div style="position:absolute;left:${x0}px;top:11px;height:22px;width:${bw}px;background:${jj.color};border-radius:5px;display:flex;align-items:center;overflow:hidden;padding:0 6px;box-shadow:0 1px 3px rgba(0,0,0,.3)">${bw>36?`<span style="font-family:var(--mono);font-size:10px;font-weight:700;color:#fff;white-space:nowrap">${jj.number||a.job_id}</span>`:''}</div>`;}
        const ps=Math.max(x0,todayX);
        if(ps<x1){const bw=x1-ps;bars+=`<div style="position:absolute;left:${ps}px;top:11px;height:22px;width:${bw}px;border-radius:5px;border:1px dashed ${jj.color};background:repeating-linear-gradient(45deg,${jj.color}22 0 4px,${jj.color}08 4px 8px);display:flex;align-items:center;overflow:hidden;padding:0 6px">${bw>36?`<span style="font-family:var(--mono);font-size:10px;font-weight:700;color:${jj.color};white-space:nowrap">${jj.number||a.job_id}</span>`:''}</div>`;}
      });
      timelineHTML+=`<div style="height:44px;border-bottom:1px solid var(--border-hairline);position:relative">${gridHTML}${bars}</div>`;
    });
  });

  if(!groups.length){
    $('screen-area').innerHTML=`<div class="empty-state"><svg width="40" height="40" fill="none" stroke="currentColor" stroke-width="1.5" viewBox="0 0 24 24"><circle cx="12" cy="12" r="9"/><line x1="12" y1="7" x2="12" y2="13"/><line x1="12" y1="17" x2="12.01" y2="17"/></svg><h3>No workers yet</h3><p>Add workers to the roster to see their schedule here.</p>${isAdmin()?`<button class="btn-red" onclick="setScreen('roster')">Go to Roster</button>`:''}</div>`;
    return;
  }

  const zoomBtns=['Day','Week','Month'].map(z=>`<button onclick="UI.zoom='${z}';renderSchedule()" style="font-family:var(--mono);font-size:12px;font-weight:700;padding:6px 14px;border-radius:6px;border:none;background:${zoom===z?'var(--red)':'transparent'};color:${zoom===z?'#fff':'var(--text-muted)'};cursor:pointer">${z}</button>`).join('');

  $('screen-area').innerHTML=`
    <div style="display:flex;align-items:flex-end;justify-content:space-between;gap:14px;margin-bottom:16px;flex-wrap:wrap">
      <div>
        <div style="font-size:16px;font-weight:700">Crew Timeline</div>
        <div style="font-size:12px;color:var(--text-muted);font-family:var(--mono);margin-top:3px">FEB &ndash; JUL 2026 &middot; RETROSPECTIVE + PROJECTED</div>
      </div>
      <div style="display:flex;align-items:center;gap:12px;flex-wrap:wrap">
        <div style="display:flex;align-items:center;gap:6px;font-family:var(--mono);font-size:11px;color:var(--text-muted)"><span style="width:20px;height:10px;border-radius:3px;background:var(--text-muted);display:inline-block"></span>ASSIGNED</div>
        <div style="display:flex;align-items:center;gap:6px;font-family:var(--mono);font-size:11px;color:var(--text-muted)"><span style="width:20px;height:10px;border-radius:3px;border:1px dashed var(--text-faint);display:inline-block"></span>PROJECTED</div>
        <div style="display:flex;background:var(--panel-2);border:1px solid var(--border);border-radius:8px;padding:3px;gap:2px">${zoomBtns}</div>
        ${isAdmin()||isPM()?`<button class="btn-red" style="padding:7px 13px;font-size:12px" onclick="openAssignModal()">+ Assign</button>`:''}
      </div>
    </div>
    <div class="gantt-wrap">
      <div class="gantt-inner">
        <div class="gantt-labels">${labelsHTML}</div>
        <div style="position:relative;flex-shrink:0;width:${width}px">${timelineHTML}</div>
      </div>
    </div>`;
}

  const onSite=DATA.workers.filter(w=>currentJob(w)!=='YARD').length;
  const avail=DATA.workers.filter(w=>currentJob(w)==='YARD').length;
  const pendingNames=new Set(DATA.requests.filter(r=>r.status==='Pending'&&r.request_type==='person').map(r=>r.worker_name));

  const groupsHTML=groups.map(({job,people})=>`
    <div style="margin-bottom:26px">

      <div style="display:grid;grid-template-columns:repeat(auto-fill,minmax(240px,1fr));gap:11px">
        ${people.map((p,i)=>{
          const isAvail=currentJob(p)==='YARD';
          let status=isAvail?'Available':'On site';
          if(pendingNames.has(p.name))status='Requested';
          const sc={Onsite:['#DCFCE7','#166534'],Available:[`rgba(226,20,60,.12)`,'var(--red)'],Requested:['#FEF3C7','#92400E']}[status.replace(' ','')]||['rgba(255,255,255,.06)','var(--text-muted)'];
          return`<div style="background:var(--panel-2);border:1px solid var(--border);border-radius:11px;padding:14px;display:flex;gap:12px;align-items:center">
            <div style="width:40px;height:40px;border-radius:10px;flex-shrink:0;background:${isAvail?'var(--border)':job.color};color:#fff;display:flex;align-items:center;justify-content:center;font-weight:700;font-size:14px">${p.initials||initials(p.name)}</div>
            <div style="flex:1;min-width:0">
              <div style="font-size:14px;font-weight:700;margin-bottom:3px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis">${p.name}</div>
              <span style="display:inline-block;background:rgba(255,255,255,.08);color:var(--text-muted);font-size:11px;font-weight:600;padding:2px 8px;border-radius:5px">${p.trade_class}</span>
              ${p.phone?`<div style="font-size:11px;color:var(--text-label);font-family:var(--mono);margin-top:5px">${p.phone}</div>`:''}
            </div>
            <div style="display:flex;flex-direction:column;align-items:flex-end;gap:6px">
              <span class="badge" style="background:${sc[0]};color:${sc[1]}">${status.toUpperCase()}</span>
              ${isAdmin()||isPM()?`<div style="display:flex;gap:4px"><button class="btn-ghost" style="font-size:10px;padding:3px 6px" onclick="openAssignModalForWorker('${p.id}')">Assign</button><button class="btn-ghost" style="font-size:10px;padding:3px 6px" onclick="openEditWorker('${p.id}')">Edit</button></div>`:''}
            </div>
          </div>`;
        }).join('')}
      </div>
    </div>`).join('');

  $('screen-area').innerHTML=`
    <div style="display:flex;align-items:center;justify-content:space-between;gap:14px;margin-bottom:22px;flex-wrap:wrap">
      <div style="display:flex;gap:16px;font-family:var(--mono);font-size:12px;font-weight:700">
        <span style="color:var(--text-muted)">${DATA.workers.length} WORKERS</span>
        <span style="color:var(--green)">${onSite} ON SITE</span>
        <span style="color:var(--red)">${avail} AVAILABLE</span>
      </div>
      <div style="display:flex;gap:8px">
        ${isAdmin()||isPM()?`<button class="btn-outline" onclick="openAssignModal()">+ Assign to Job</button>`:''}

      </div>
    </div>
    ${groups.length?groupsHTML:`<div class="empty-state"><svg width="40" height="40" fill="none" stroke="currentColor" stroke-width="1.5" viewBox="0 0 24 24"><path d="M17 21v-2a4 4 0 0 0-4-4H5a4 4 0 0 0-4 4v2"/><circle cx="9" cy="7" r="4"/></svg><h3>No workers yet</h3><p>Add workers to the roster to get started.</p>${isAdmin()?`<button class="btn-red" onclick="openNewWorker()">Add Worker</button>`:''}</div>`}`;

let selectedJobId=null;

function renderJobs(){

    return`<button onclick="selectedJobId='${j.id}';renderJobs()" style="width:100%;text-align:left;padding:14px 16px;background:${active?'rgba(226,20,60,.06)':'transparent'};border:none;border-left:3px solid ${active?'var(--red)':'transparent'};border-bottom:1px solid var(--border);cursor:pointer;transition:all .12s">

        <span style="font-size:14px;font-weight:700;flex:1;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;color:var(--text)">${j.name}</span>
        <span style="font-size:11px;font-weight:600;padding:2px 8px;border-radius:20px;background:${j.status==='Active'?'rgba(22,163,74,.12)':'rgba(0,0,0,.06)'};color:${j.status==='Active'?'#16a34a':'var(--text-muted)'}">${j.status}</span>
      </div>
      <div style="display:flex;align-items:center;gap:10px">
        <span style="font-size:12px;color:var(--text-muted);font-family:var(--mono)">${crew.length} crew</span>

  if(selJob){

    const pm=accountById(selJob.pm_id);
    const pendReqs=DATA.requests.filter(r=>(r.from_job_id===selJob.id||r.to_job_id===selJob.id)&&r.status==='Pending');
    const pendingNames=new Set(DATA.requests.filter(r=>r.status==='Pending'&&r.request_type==='person').map(r=>r.worker_name));

    const crewRows=crew.length?crew.map(w=>{
      const assign=DATA.assignments.filter(a=>a.worker_id===w.id&&a.job_id===selJob.id).sort((a,b)=>b.start_date>a.start_date?1:-1)[0];
      let status='On site';
      if(pendingNames.has(w.name))status='Requested';
      const sc={'On site':['#DCFCE7','#166534'],'Requested':['#FEF3C7','#92400E']}[status]||['rgba(0,0,0,.06)','var(--text-muted)'];
      const sinceStr=assign&&assign.start_date?' \u00b7 since '+fmtDateShort(assign.start_date):'';
      return`<div style="display:flex;align-items:center;gap:10px;padding:11px 0;border-bottom:1px solid var(--border-hairline)">
        <div style="width:36px;height:36px;border-radius:9px;background:${selJob.color};color:#fff;display:flex;align-items:center;justify-content:center;font-weight:700;font-size:13px;flex-shrink:0">${w.initials||initials(w.name)}</div>
        <div style="flex:1;min-width:0">
          <div style="font-size:13px;font-weight:600">${w.name}</div>
          <div style="font-size:11px;color:var(--text-muted)">${w.trade_class}${sinceStr}</div>
        </div>
        <div style="display:flex;align-items:center;gap:8px">
          <span class="badge" style="background:${sc[0]};color:${sc[1]}">${status.toUpperCase()}</span>
          ${(isAdmin()||isPM())?`<button class="btn-ghost" style="font-size:11px;color:var(--text-muted)" onclick="removeFromJob('${w.id}','${selJob.id}')">Remove</button>`:''}
        </div>
      </div>`;
    }).join(''):'<div style="text-align:center;color:var(--text-muted);padding:24px 0;font-size:13px">No crew assigned \u2014 use <strong>+ Add Crew</strong> to assign workers</div>';

    detailHTML=`
      <div style="display:flex;align-items:flex-start;justify-content:space-between;gap:12px;margin-bottom:20px;flex-wrap:wrap">
        <div>
          <div style="display:flex;align-items:center;gap:8px;margin-bottom:4px">
            <span class="color-dot" style="background:${selJob.color};width:12px;height:12px;border-radius:3px"></span>
            <span style="font-family:var(--mono);font-size:11px;color:var(--text-label);font-weight:700">${selJob.number||'&mdash;'}</span>

        <div class="kpi-card" style="padding:12px 14px">

          <div class="kpi-label">Project Manager</div>
          <div style="font-size:14px;font-weight:600;margin-top:4px;color:${pm?'var(--text)':'var(--text-muted)'}">${pm?pm.name:'Unassigned'}</div>
        </div>
        <div class="kpi-card" style="padding:12px 14px;cursor:pointer" onclick="UI.reqTab='all';setScreen('requests')">
          <div class="kpi-label">Open Requests</div>
          <div style="font-family:var(--mono);font-size:24px;font-weight:800;letter-spacing:-1px;color:${pendReqs.length?'var(--amber)':'var(--text-muted)'}">${pendReqs.length}</div>
        </div>
      </div>
      <div style="display:flex;align-items:center;justify-content:space-between;margin-bottom:10px">
        <div style="font-size:12px;font-weight:700;color:var(--text-label);text-transform:uppercase;letter-spacing:.8px;font-family:var(--mono)">Current Crew</div>
        ${(isAdmin()||isPM())?`<button class="btn-ghost" style="font-size:12px" onclick="UI.reqTab='all';setScreen('requests')">View Requests</button>`:''}
      </div>
      <div style="border:1px solid var(--border);border-radius:12px;padding:0 16px">
        ${crewRows}
      </div>`;
  }

  $('screen-area').innerHTML=`
    <div style="display:flex;align-items:center;justify-content:space-between;margin-bottom:16px">
      <div style="font-size:14px;color:var(--text-muted)">${jobs.length} job${jobs.length!==1?'s':''}</div>
      ${isAdmin()?`<button class="btn-red" onclick="openNewJob()">+ New Job</button>`:''}
    </div>
    <div style="display:grid;grid-template-columns:260px 1fr;gap:16px;align-items:start">
      <div style="background:#fff;border:1px solid var(--border);border-radius:12px;overflow:hidden">
        ${listHTML||'<div style="padding:24px;text-align:center;color:var(--text-muted)">No jobs yet</div>'}
      </div>
      <div style="background:#fff;border:1px solid var(--border);border-radius:12px;padding:20px">${detailHTML}</div>
    </div>`;
}

function fmtDateShort(d){
  if(!d)return '';
  const ms=['Jan','Feb','Mar','Apr','May','Jun','Jul','Aug','Sep','Oct','Nov','Dec'];
  const[y,m,dd]=d.split('-');
  return ms[parseInt(m)-1]+' '+parseInt(dd);
}

async function removeFromJob(workerId,jobId){
  if(!confirm('Remove this worker from the job? Their assignment history is preserved.'))return;
  const todayD=new Date().toISOString().slice(0,10);
  const yesterday=new Date(Date.now()-86400000).toISOString().slice(0,10);
  const active=DATA.assignments
    .filter(a=>a.worker_id===workerId&&a.job_id===jobId)
    .sort((a,b)=>b.start_date>a.start_date?1:-1)
    .find(a=>a.is_permanent||(!a.end_date||a.end_date>=todayD));
  if(active){
    active.end_date=yesterday;
    active.is_permanent=false;
    if(SB)await SB.from('mp_assignments').update({end_date:yesterday,is_permanent:false}).eq('id',active.id);
  }
  showToast('Worker removed from job');
  renderJobs();
}

function openAssignToJob(jobId){
  preselectedJobId=jobId;
  populateAssignForm(jobId);
  openModal('modal-assign');
}

function openAssignModalForWorker(workerId){
  preselectedJobId=null;
  populateAssignForm(null);
  if($('assign-worker'))$('assign-worker').value=workerId;
  openModal('modal-assign');
}

function openModal(id){$(id).classList.remove('hidden');}
function closeModal(id){$(id).classList.add('hidden');}

// ── REQUEST MODAL ──
let editingReqId=null;
function openRequestModal(){
  editingReqId=null;
  $('modal-request-title').textContent='New Manpower Request';
  populateRequestForm({});
  openModal('modal-request');
}
function openEditRequest(id){
  editingReqId=id;
  const r=DATA.requests.find(x=>x.id===id);
  $('modal-request-title').textContent='Edit Request';
  populateRequestForm(r||{});
  openModal('modal-request');
}
function populateRequestForm(r){
  $('req-dir').value=r.direction||'in';
  $('req-type').value=r.request_type||'person';
  $('req-priority').value=r.priority||'Normal';
  $('req-perm').value=r.is_permanent?'1':'0';
  $('req-start').value=r.start_date||today();
  $('req-end').value=r.end_date||'';
  $('req-qty').value=r.qty||1;
  $('req-role').value=r.role_requested||'Journeyman';
  $('req-note').value=r.note||'';
  $('req-error').style.display='none';

  // Populate worker select
  const ws=$('req-worker');ws.innerHTML=DATA.workers.map(w=>`<option value="${w.id}"${w.id===r.worker_id?' selected':''}>${w.name} (${w.trade_class})</option>`).join('');

  // Populate job selects
  const js=j=>`<option value="${j.id}">${j.name}</option>`;
  $('req-from').innerHTML=DATA.jobs.map(js).join('');
  $('req-to').innerHTML=DATA.jobs.map(js).join('');
  if(r.from_job_id)$('req-from').value=r.from_job_id;
  else if(myJobId())$('req-from').value=myJobId();
  if(r.to_job_id)$('req-to').value=r.to_job_id;

  // Populate counter PM
  $('req-counter').innerHTML='<option value="">— Select PM —</option>'+DATA.accounts.filter(a=>a.role==='pm'||a.role==='admin').map(a=>`<option value="${a.id}"${a.id===r.counter_pm_id?' selected':''}>${a.name}</option>`).join('');

  updateRequestForm();
}
function updateRequestForm(){
  const type=$('req-type').value;
  $('req-person-fields').classList.toggle('hidden',type!=='person');
  $('req-role-fields').classList.toggle('hidden',type!=='role');
  $('req-dates').classList.toggle('hidden',$('req-perm').value==='1');
}
async function saveRequest(){
  const dir=$('req-dir').value,type=$('req-type').value;
  const fromId=$('req-from').value,toId=$('req-to').value;
  if(!fromId||!toId){$('req-error').textContent='Please select both jobs.';$('req-error').style.display='block';return;}
  if(fromId===toId){$('req-error').textContent='From and To jobs must be different.';$('req-error').style.display='block';return;}
  const isPerm=$('req-perm').value==='1';
  let workerName='',workerRole='',workerId='';
  if(type==='person'){
    const w=workerById($('req-worker').value);
    if(!w){$('req-error').textContent='Please select a worker.';$('req-error').style.display='block';return;}
    workerName=w.name;workerRole=w.trade_class;workerId=w.id;
  }
  const now=new Date();
  const submitted=now.toLocaleDateString('en-US',{month:'short',day:'numeric',year:'numeric'});
  const row={
    id:editingReqId||'req'+uid(),
    direction:dir,request_type:type,
    worker_id:workerId,worker_name:workerName,worker_role:workerRole,
    role_requested:type==='role'?$('req-role').value:'',
    qty:parseInt($('req-qty').value)||1,
    from_job_id:fromId,to_job_id:toId,
    counter_pm_id:$('req-counter').value,
    is_permanent:isPerm,
    start_date:isPerm?'':$('req-start').value,
    end_date:isPerm?'':$('req-end').value,
    priority:$('req-priority').value,status:'Pending',
    submitted_by:ME.id||null,submitted_at:submitted,
    note:$('req-note').value.trim(),
  };
  if(editingReqId){
    const idx=DATA.requests.findIndex(r=>r.id===editingReqId);
    if(idx>=0)DATA.requests[idx]=row;
  } else {
    DATA.requests.unshift(row);
  }
  const rok=await sbUpsert('mp_requests',{id:row.id,direction:row.direction,request_type:row.request_type,worker_id:row.worker_id||null,worker_name:row.worker_name||null,worker_role:row.worker_role||null,role_requested:row.role_requested||null,qty:row.qty,from_job_id:row.from_job_id,to_job_id:row.to_job_id,counter_pm_id:row.counter_pm_id||null,is_permanent:row.is_permanent,start_date:row.start_date||null,end_date:row.end_date||null,priority:row.priority,status:row.status,submitted_by:row.submitted_by||null,submitted_at:row.submitted_at||null,note:row.note||null});
  if(!rok){DATA.requests=DATA.requests.filter(r=>r.id!==row.id);return;}
  UI.selReqId=row.id;
  closeModal('modal-request');
  showToast(editingReqId?'Request updated':'Request submitted');
  setScreen('requests');
}

async function resolveRequest(id,status){
  const r=DATA.requests.find(x=>x.id===id);if(!r)return;
  r.status=status;
  if(SB)await SB.from('mp_requests').update({status,resolved_at:Date.now(),resolved_by:ME.id||null}).eq('id',id);
  showToast(status==='Approved'?'Request approved — crew movement scheduled':'Request denied');
  renderRequests();
}

async function deleteRequest(id){
  if(!confirm('Delete this request? This cannot be undone.'))return;
  DATA.requests=DATA.requests.filter(r=>r.id!==id);
  await sbDelete('mp_requests',id);
  UI.selReqId=null;
  showToast('Request deleted');
  renderRequests();
}

// ── JOB MODAL ──
let editingJobId=null;
function openNewJob(){editingJobId=null;$('modal-job-title').textContent='New Job';populateJobForm({});openModal('modal-job');}
function openEditJob(id){editingJobId=id;$('modal-job-title').textContent='Edit Job';populateJobForm(DATA.jobs.find(j=>j.id===id)||{});openModal('modal-job');}
function populateJobForm(j){
  $('job-name').value=j.name||'';$('job-short').value=j.short_name||'';
  $('job-number').value=j.number||'';$('job-location').value=j.location||'';
  $('job-phase').value=j.phase||'';$('job-status').value=j.status||'Active';
  $('job-color').value=j.color||'#E2123C';$('job-start').value=j.start_date||'';
  $('job-error').style.display='none';
  $('job-pm').innerHTML='<option value="">— No PM —</option>'+DATA.accounts.filter(a=>a.role==='pm'||a.role==='admin').map(a=>`<option value="${a.id}"${a.id===j.pm_id?' selected':''}>${a.name}</option>`).join('');
}
async function saveJob(){
  const name=$('job-name').value.trim();
  if(!name){$('job-error').textContent='Job name is required.';$('job-error').style.display='block';return;}
  const row={id:editingJobId||'j'+uid(),name,short_name:$('job-short').value.trim()||name,number:$('job-number').value.trim()||null,location:$('job-location').value.trim()||null,phase:$('job-phase').value.trim()||null,status:$('job-status').value,pm_id:$('job-pm').value||null,color:$('job-color').value,start_date:$('job-start').value||null};
  if(editingJobId){const idx=DATA.jobs.findIndex(j=>j.id===editingJobId);if(idx>=0)DATA.jobs[idx]=row;}
  else DATA.jobs.push(row);
  const ok=await sbUpsert('mp_jobs',{id:row.id,name:row.name,short_name:row.short_name,number:row.number,location:row.location,phase:row.phase,status:row.status,pm_id:row.pm_id,color:row.color,start_date:row.start_date});
  if(!ok){if(!editingJobId)DATA.jobs=DATA.jobs.filter(j=>j.id!==row.id);return;}
  closeModal('modal-job');showToast(editingJobId?'Job updated':'Job created');render();
}

// ── WORKER MODAL ──
let editingWorkerId=null;
function openNewWorker(){editingWorkerId=null;$('modal-worker-title').textContent='Add Worker';['wk-first','wk-last','wk-phone'].forEach(id=>$(id).value='');$('wk-trade').value='Journeyman';$('wk-error').style.display='none';openModal('modal-worker');}
function openEditWorker(id){
  editingWorkerId=id;
  const w=DATA.workers.find(x=>x.id===id);if(!w)return;
  $('modal-worker-title').textContent='Edit Worker';
  const parts=w.name.split(' ');
  $('wk-first').value=parts[0]||'';$('wk-last').value=parts.slice(1).join(' ')||'';
  $('wk-trade').value=w.trade_class;$('wk-phone').value=w.phone||'';
  $('wk-error').style.display='none';
  openModal('modal-worker');
}
async function saveWorker(){
  const first=$('wk-first').value.trim(),last=$('wk-last').value.trim();
  if(!first){$('wk-error').textContent='First name required.';$('wk-error').style.display='block';return;}
  const name=(first+' '+last).trim();
  const row={id:editingWorkerId||'w'+uid(),name,initials:initials(name),trade_class:$('wk-trade').value,phone:$('wk-phone').value.trim(),rates:{}};
  if(editingWorkerId){const idx=DATA.workers.findIndex(w=>w.id===editingWorkerId);if(idx>=0)DATA.workers[idx]={...DATA.workers[idx],...row};}
  else DATA.workers.push(row);
  const wok=await sbUpsert('workers',{id:row.id,name:row.name,initials:row.initials,trade_class:row.trade_class,phone:row.phone||null});
  if(!wok){if(!editingWorkerId)DATA.workers=DATA.workers.filter(w=>w.id!==row.id);return;}
  closeModal('modal-worker');showToast(editingWorkerId?'Worker updated':'Worker added');render();
}

// ── ASSIGNMENT MODAL ──
let preselectedJobId=null;
function openAssignModal(){preselectedJobId=null;populateAssignForm(null);openModal('modal-assign');}
function openAssignModalForJob(jobId){preselectedJobId=jobId;populateAssignForm(jobId);openModal('modal-assign');}
function populateAssignForm(forJobId){
  const jid=forJobId||preselectedJobId||'';
  $('assign-worker').innerHTML=DATA.workers.map(w=>{const cj=currentJob(w);const onThis=jid&&cj===jid;const label=w.name+' ('+w.trade_class+')'+(onThis?' — already here':(cj!=='YARD'?' — on '+jobById(cj).name:''));return`<option value="${w.id}">${label}</option>`;}).join('');
  $('assign-job').innerHTML=DATA.jobs.map(j=>`<option value="${j.id}"${j.id===jid?' selected':''}>${j.name}</option>`).join('');
  $('assign-start').value=today();$('assign-end').value='';$('assign-perm').value='0';
  $('assign-end-wrap').classList.remove('hidden');$('assign-error').style.display='none';
}
async function saveAssignment(){
  const wid=$('assign-worker').value,jid=$('assign-job').value,start=$('assign-start').value;
  if(!wid||!jid||!start){$('assign-error').textContent='Worker, job, and start date are required.';$('assign-error').style.display='block';return;}
  const isPerm=$('assign-perm').value==='1';
  const row={id:'a'+uid(),worker_id:wid,job_id:jid,start_date:start,end_date:isPerm?null:($('assign-end').value||null),is_permanent:isPerm};
  DATA.assignments.push(row);
  const aok=await sbUpsert('mp_assignments',{id:row.id,worker_id:row.worker_id,job_id:row.job_id,start_date:row.start_date,end_date:row.end_date||null,is_permanent:row.is_permanent});
  if(!aok){DATA.assignments=DATA.assignments.filter(a=>a.id!==row.id);return;}
  closeModal('modal-assign');showToast('Worker assigned');render();
}

// ── ACCOUNT MODAL ──
let editingAccId=null;
function openNewAccount(){editingAccId=null;$('modal-account-title').textContent='Add Account';$('acc-save-btn').textContent='Add Account';['acc-first','acc-last','acc-email','acc-password','acc-password2'].forEach(id=>$(id).value='');$('acc-role').value='pm';$('acc-error').style.display='none';$('acc-pw-wrap').style.display='';$('acc-pw2-wrap').style.display='';populateAccJobSelect();openModal('modal-account');}
function openEditAccount(id){
  editingAccId=id;
  const a=DATA.accounts.find(x=>x.id===id);if(!a)return;
  $('modal-account-title').textContent='Edit Account';$('acc-save-btn').textContent='Save Changes';
  const parts=(a.name||'').split(' ');
  $('acc-first').value=parts[0]||a.first_name||'';$('acc-last').value=parts.slice(1).join(' ')||a.last_name||'';
  $('acc-email').value=a.email;$('acc-role').value=a.role;
  $('acc-password').value='';$('acc-password2').value='';
  $('acc-pw-wrap').querySelector('label').textContent='New Password (leave blank to keep)';
  $('acc-error').style.display='none';
  populateAccJobSelect(a.jobId);
  openModal('modal-account');
}
function populateAccJobSelect(sel){
  $('acc-job').innerHTML='<option value="">— No specific job —</option>'+DATA.jobs.map(j=>`<option value="${j.id}"${j.id===sel?' selected':''}>${j.name}</option>`).join('');
}
async function saveAccount(){
  const first=$('acc-first').value.trim(),last=$('acc-last').value.trim();
  const email=$('acc-email').value.trim().toLowerCase();
  const pw=$('acc-password').value,pw2=$('acc-password2').value;
  const role=$('acc-role').value,jobId=$('acc-job').value;
  const showErr=msg=>{$('acc-error').textContent=msg;$('acc-error').style.display='block';};
  if(!first||!last){showErr('Full name required.');return;}
  if(!email){showErr('Email required.');return;}
  if(!editingAccId&&pw.length<6){showErr('Password must be at least 6 characters.');return;}
  if(pw&&pw!==pw2){showErr('Passwords do not match.');return;}
  if(DATA.accounts.find(a=>a.email===email&&a.id!==editingAccId)){showErr('Email already in use.');return;}
  const name=(first+' '+last).trim();
  const pwHash=pw?hashPw(pw):(editingAccId?DATA.accounts.find(a=>a.id===editingAccId)?.passwordHash:'');
  const row={id:editingAccId||'u'+uid(),name,first_name:first,last_name:last,email,passwordHash:pwHash,role,jobId};
  if(editingAccId){const idx=DATA.accounts.findIndex(a=>a.id===editingAccId);if(idx>=0)DATA.accounts[idx]=row;}
  else DATA.accounts.push(row);
  const acok=await sbUpsert('accounts',{id:row.id,first_name:first,last_name:last,email,password_hash:pwHash,role,project_id:jobId||null});
  if(!acok){if(!editingAccId)DATA.accounts=DATA.accounts.filter(a=>a.id!==row.id);return;}
  saveLocalAccounts(DATA.accounts.map(a=>({id:a.id,firstName:a.first_name||a.name?.split(' ')[0],lastName:a.last_name||a.name?.split(' ').slice(1).join(' '),email:a.email,passwordHash:a.passwordHash,role:a.role})));
  closeModal('modal-account');showToast(editingAccId?'Account updated':'Account created');renderAccounts();
}
async function deleteAccount(id){
  if(id===ME.id){showToast("You can't delete your own account.",true);return;}
  if(!confirm('Remove this account? They will no longer be able to sign in.'))return;
  DATA.accounts=DATA.accounts.filter(a=>a.id!==id);
  await sbDelete('accounts',id);
  showToast('Account removed');renderAccounts();
}

// ═══════════════════════════════════════════════════════════════
// BOOT
// ═══════════════════════════════════════════════════════════════
(async function boot(){
  // Supabase SDK loaded synchronously in head — no async race
  if(window.supabase){
    SB=window.supabase.createClient(SB_URL,SB_KEY);
  } else {
    console.error('Supabase SDK failed to load');
  }

  // Load all live data — this will surface schema errors visibly if tables are missing
  await loadData();
  initRealtime();

  // Seed default admin account if the accounts table is empty
  if(!DATA.accounts.length && !schemaErrorShown){
    const def={
      id:'u1',first_name:'Admin',last_name:'User',name:'Admin User',
      email:'admin@dinto.com',passwordHash:hashPw('dinto123'),role:'admin',jobId:'',
    };
    DATA.accounts.push(def);
    await sbUpsert('accounts',{
      id:def.id,first_name:def.first_name,last_name:def.last_name,
      email:def.email,password_hash:def.passwordHash,role:def.role,project_id:null,
    });
    saveLocalAccounts([{
      id:def.id,firstName:def.first_name,lastName:def.last_name,
      email:def.email,passwordHash:def.passwordHash,role:def.role,
    }]);
  }

  if(schemaErrorShown)return; // stop here — user needs to run schema.sql first

  // Hide loading overlay
  const ov=document.getElementById('loading-overlay');
  if(ov){ov.classList.add('fade');setTimeout(()=>ov.style.display='none',350);}

  // Restore previous session (keeps user logged in across refreshes/tabs)
  try{
    const saved=JSON.parse(localStorage.getItem(SESSION_KEY)||'{}');
    if(saved.id&&saved.name){
      ME=Object.assign({loggedIn:true},saved);
      launchApp();
      return;
    }
  }catch(e){console.warn('Session restore:',e);}

  document.getElementById('login-screen').style.display='flex';
})()
</script>
